<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="360" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <!-- sources -->
  <g>
    <rect x="24" y="40" width="190" height="64" rx="12" fill="#e8f7ee" stroke="#07c160" stroke-width="2"/>
    <text x="119" y="68" text-anchor="middle" font-size="17" font-weight="600" fill="#065f46">WeChat</text>
    <text x="119" y="90" text-anchor="middle" font-size="13" fill="#065f46">message arrives</text>
    <rect x="24" y="124" width="190" height="64" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="119" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Messages, Slack, …</text>
    <text x="119" y="174" text-anchor="middle" font-size="13" fill="#374151">any app in config.apps</text>
    <rect x="24" y="250" width="190" height="64" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="119" y="278" text-anchor="middle" font-size="17" font-weight="600" fill="#374151">Your own trigger</text>
    <text x="119" y="300" text-anchor="middle" font-size="12" fill="#374151" font-family="Menlo, monospace">open "wake://ring?…"</text>
  </g>
  <!-- notification log -->
  <rect x="268" y="72" width="200" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="368" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#3730a3">macOS notification log</text>
  <text x="368" y="124" text-anchor="middle" font-size="12" fill="#3730a3">usernoted SQLite db</text>
  <text x="368" y="142" text-anchor="middle" font-size="12" fill="#3730a3">(read-only, Full Disk Access)</text>
  <!-- watcher -->
  <rect x="520" y="72" width="190" height="84" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="615" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3412">notify-watch.mjs</text>
  <text x="615" y="124" text-anchor="middle" font-size="12" fill="#9a3412">polls every 5 s</text>
  <text x="615" y="142" text-anchor="middle" font-size="12" fill="#9a3412">names, mutes, guards</text>
  <!-- outputs -->
  <rect x="756" y="30" width="184" height="84" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="848" y="60" text-anchor="middle" font-size="16" font-weight="600" fill="#155e75">Super Productivity</text>
  <text x="848" y="82" text-anchor="middle" font-size="12" fill="#155e75">one task per chat,</text>
  <text x="848" y="100" text-anchor="middle" font-size="12" fill="#155e75">REST API on 127.0.0.1:3876</text>
  <rect x="756" y="196" width="184" height="118" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="848" y="226" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">Wake.app</text>
  <text x="848" y="248" text-anchor="middle" font-size="12" fill="#991b1b">every screen, volume 100,</text>
  <text x="848" y="266" text-anchor="middle" font-size="12" fill="#991b1b">siren until you solve</text>
  <text x="848" y="284" text-anchor="middle" font-size="12" fill="#991b1b">the math problems</text>
  <!-- arrows -->
  <path d="M214 72 L266 100" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M214 156 L266 130" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M468 114 L518 114" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M710 100 L754 76" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M710 134 L754 220" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="700" y="180" text-anchor="end" font-size="11" fill="#6b7280" font-family="Menlo, monospace">wake://ring</text>
  <text x="700" y="198" text-anchor="end" font-size="11" fill="#6b7280">only if away 15 min,</text>
  <text x="700" y="214" text-anchor="end" font-size="11" fill="#6b7280">at most once per 10 min</text>
  <path d="M214 282 L754 268" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#6b7280">rings right away, from Shortcuts, cron, a script, anything</text>
</svg>
